# Benchmark Configuration for MuSR Narrative Questions
# Compares multi-agent vs single model performance

benchmark:
  name: "MuSR Narrative Benchmark"
  dataset: "TAUR-Lab/MuSR"
  question_type: "multipleChoice"
  max_questions: 50 # Limit for testing
  
  # Single Models to Test
  single_models:
    - name: "gpt5nano"
      backend:
        type: "openai"
        model: "gpt-5-nano"
        text:
          verbosity: "medium"
        reasoning:
          effort: "medium"
          summary: "auto"
      system_message: "You are a helpful AI assistant. For narrative questions, provide your analysis and reasoning, but always end your response with ONLY the letter of your chosen option in this exact format: The answer is: X, where X is A, B, C, D, ...Z .Do not include any additional text after the answer letter and provide confidence scores."
    
    - name: "grok4"
      backend:
        type: "grok"
        model: "grok-4"
      system_message: "You are a helpful AI assistant. For narrative questions, provide your analysis and reasoning, but always end your response with ONLY the letter of your chosen option in this exact format: The answer is: X, where X is A, B, C, D, ...Z .Do not include any additional text after the answer letter and provide confidence scores."
    
    - name: "claudesonnet420250514"
      backend:
        type: "claude_code"
        model: "claude-sonnet-4-20250514"
      system_message: "You are a helpful AI assistant. For narrative questions, provide your analysis and reasoning, but always end your response with ONLY the letter of your chosen option in this exact format: The answer is: X, where X is A, B, C, D, ...Z .Do not include any additional text after the answer letter and provide confidence scores."

  # Multi-Agent Configuration
  multi_agent:
    config_file: "four_agents_advanced.yaml"
    system_message: "You are a helpful AI assistant. For narrative questions, provide your analysis and reasoning, but always end your response with ONLY the letter of your chosen option in this exact format: The answer is: X, where X is A, B, C, D, ...Z .Do not include any additional text after the answer letter and provide confidence scores."
  

  # Metrics to Calculate
  metrics:
    - accuracy
    - calibration_error
    - confidence_scores
  
  # Output
  output:
    format: "table"
    save_results: true
    results_file: "benchmark_musr_results.json"