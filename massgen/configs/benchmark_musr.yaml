# Benchmark Configuration for MuSR Narrative Questions
# Compares multi-agent vs single model performance

benchmark:
  name: "MuSR Narrative Benchmark"
  dataset: "TAUR-Lab/MuSR"
  question_type: "multipleChoice"
  max_questions: 100 # Limit for testing
  
  # Single Models to Test (empty list - using multi-agent instead)
  single_models: []

  # Multi-Agent Configuration
  multi_agent:
    config_file: "four_agents_advanced.yaml"
    system_message: "You are a helpful AI assistant. For narrative questions, provide your analysis and reasoning. Please give your answer in the following JSON format: ```json {\"answer\": <str>} ``` Please don't generate anything except JSON format."
  
  # Judge Model Configuration for Multi-Agent Evaluation
  judge_model:
    - name: "gpt5_judge"
      backend:
        type: "openai"
        model: "gpt-5"
        text:
          verbosity: "medium"
        reasoning:
          effort: "medium"
          summary: "auto"
      system_message: "You are an expert judge evaluating AI responses to multiple choice questions. Your task is to extract the answer from the response and determine if it matches the correct answer. Please give your answer in the following JSON format: ```json {\"answer\": <str>} ``` Please don't generate anything except JSON format."

  # Metrics to Calculate
  metrics:
    - accuracy
    - calibration_error
    - confidence_scores
  
  # Output
  output:
    format: "table"
    save_results: true
    results_file: "benchmark_musr_results_100.json"